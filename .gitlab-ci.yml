include:
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/pre-commit@~latest
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/tox@~latest
    inputs:
      name-suffix: ":linux"
      tox-section: py313-cov
      stage: test
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: check

stages:
  - check
  - test
  - upload

tox:windows:
  extends: tox:linux
  services:
    - image:e3-windows-2025
    - platform:x86_64-windows
    - cpu:2
    - mem:4
    - disk:80

upload-python-registry:
  stage: upload
  services:
    - image:e3
  before_script:
    - python -m pip install twine
  script:
    - python build_wheel.py
    - python -m twine upload
      --repository-url https://${CI_SERVER_HOST}:${CI_SERVER_PORT}/api/v4/projects/202/packages/pypi
      build/*.whl
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TWINE_PASSWORD: $CI_JOB_TOKEN
    TWINE_USERNAME: gitlab-ci-token
